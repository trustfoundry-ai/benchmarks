name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm verify:results

      - name: Pack release tarball
        id: pack
        run: |
          set -euo pipefail
          pnpm pack
          out="$(ls trustfoundry-ai-benchmarks-harness-*.tgz | tail -n 1)"
          echo "tarball=$out" >> "$GITHUB_OUTPUT"

      - name: Attest release tarball provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.pack.outputs.tarball }}
